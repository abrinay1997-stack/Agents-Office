# Agents Office en Cloudflare — probar, preparar la cuenta, subir secretos, migrar, desplegar y comprobar lo publicado.
#
# Va por GitHub Actions y no por la integración Git de Cloudflare: así NADA se publica sin pasar por los tests.
# Cuenta de destino: la que corresponda a CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN (no la de esta sesión de Claude).
#
# Secretos del repositorio (Settings → Secrets and variables → Actions). Ver docs/cloudflare.md.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID        desplegar
#   ANTHROPIC_API_KEY                                   obligatoria: los agentes
#   META_API_KEY / MODEL_API_KEY, META_ACCESS_TOKEN…    opcionales (ver cloudflare/secretos.json)
#   MCP_<NOMBRE>_TOKEN                                  un token por conector MCP (se suben solos)
#   ADMIN_EMAIL, ADMIN_PASSWORD                         solo para «Cloudflare · sembrar administrador»
#   SITIO_URL                                           opcional: la dirección publicada, para la comprobación viva
name: Cloudflare · desplegar

on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'office.agents.json', 'safety.mjs', 'brain-panaclaw/**', 'biblioteca/**', 'biblioteca*.mjs', 'skills/**', 'skills.mjs', 'graph-*.mjs', 'habilidades-tools.mjs', 'arranque-*.mjs', 'restablecer-*.mjs', '.github/workflows/cloudflare-desplegar.yml']
  pull_request:
    paths: ['cloudflare/**', 'office.agents.json', 'safety.mjs', '.github/workflows/cloudflare-*.yml']
  workflow_dispatch:

concurrency:
  group: cloudflare-desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests de Cloudflare
        run: node --test cloudflare/tests/*.test.mjs
      - name: Tests de lo que el Worker comparte con la oficina (búsqueda, memoria, migración)
        run: node --test tests/cerebro-busqueda.test.mjs tests/migracion-nube.test.mjs
      # La semilla «PanaClaw por defecto» (59 notas, mapa, equipo y Biblioteca): rompe aquí, no en el despliegue, si algo no cabe o falta.
      - name: Generar la semilla (sin publicar)
        run: node cloudflare/scripts/semilla.mjs /tmp/ao-semilla
      # Las librerías de la raíz (d3-force: el mapa del Cerebro) tienen que estar para que este simulacro empaquete lo MISMO que el despliegue.
      - name: Instalar las librerías de la oficina
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Simulacro de empaquetado: rompe aquí, no en el despliegue, si el Worker importa algo que no cabe en Workers.
      - name: Empaquetar el Worker (sin publicar)
        working-directory: cloudflare
        run: npm install --no-audit --no-fund && npx wrangler deploy --dry-run --outdir /tmp/ao-worker

  desplegar:
    needs: probar
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Comprobar que hay credenciales
        run: |
          falta=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then echo "Faltan secretos del repositorio:$falta"; exit 1; fi
      - run: npm install --no-audit --no-fund
      # La interfaz REAL de la oficina (la misma de npm start): se construye en cada despliegue y el Worker la sirve detrás del login.
      - name: Construir la interfaz de la oficina
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs
          node cloudflare/scripts/copiar-oficina.mjs
      # La semilla «PanaClaw por defecto»: sale del repositorio de ESTE commit (notas, mapa, equipo y Biblioteca) y el Worker la sirve por dentro, detrás de la sesión, a quien pulse «Restablecer oficina».
      - name: Generar la semilla «PanaClaw por defecto»
        working-directory: .
        run: node cloudflare/scripts/semilla.mjs
      - name: Preparar la cuenta (D1 y R2, si no existen)
        run: node scripts/preparar-cuenta.mjs
      - name: Aplicar migraciones de D1 (antes que el código)
        run: npx wrangler d1 migrations apply agents-office-db --remote
      - name: Desplegar el Worker
        run: npx wrangler deploy
      # Los secretos se suben DESPUÉS del primer despliegue (el Worker tiene que existir) y sobreviven a los siguientes.
      - name: Subir los secretos al Worker
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node scripts/subir-secretos.mjs
      - name: Comprobar lo publicado
        env:
          SITIO_URL: ${{ secrets.SITIO_URL }}
        run: |
          if [ -z "$SITIO_URL" ]; then echo "SITIO_URL no está puesto: se omite la comprobación viva."; exit 0; fi
          node scripts/prueba-viva.mjs
