# Agents Office — every push and every Pull Request runs the tests and the full check (V4.4, 25 Sep 2026).
# If a change breaks something, GitHub marks it red before it reaches main.
name: check
on:
  push:
  pull_request:
# SEG-07: el token del workflow solo lee. Una ejecución nueva de la misma rama cancela la anterior (menos en main: cada commit de main se comprueba entero).
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets (keys, cards, ID cards)
        run: npm run secrets
      - name: Unit tests
        run: npm test
      - name: Browser for the smoke tests
        # 7 oct 2026: this step (~30 s) hung once on GitHub's runner until the job's 25 min ran out. Each try now gets
        # 5 min (the whole process group is stopped, apt included), and a hung or failed install is tried once more.
        timeout-minutes: 12
        run: |
          for intento in 1 2; do
            if timeout -k 20 300 npx playwright-core install --with-deps chromium; then exit 0; fi
            echo "::warning::Chromium no se instaló en el intento $intento (se colgó o falló); se reintenta."
            sleep 10
          done
          exit 1
      - name: Full check (build, roster, skills, routines, Estudio, server, page)
        env:
          AO_TESTS_YA: '1' # el paso «Unit tests» de arriba ya corrió las pruebas sin navegador
        run: npm run check
