# Fase 10.1: actualizaciones semanales y agrupadas (un solo PR por ecosistema, para no inundar el repositorio).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      dependencias: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /cloudflare
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      dependencias-cloudflare: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      acciones: { patterns: ["*"] }
